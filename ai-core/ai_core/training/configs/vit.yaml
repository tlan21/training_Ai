model:
  name: vit
  d_model: 256
  n_layers: 6
  n_heads: 8
  img_size: 224
  patch_size: 16
  n_classes: 4
train:
  model: vit
  lr: 3.0e-4
  weight_decay: 0.1
  batch_size: 128
  grad_accum: 1
  max_steps: 20000
  warmup_ratio: 0.03
  min_lr_ratio: 0.10
  precision: bf16
  seed: 1337
  metric_name: accuracy
