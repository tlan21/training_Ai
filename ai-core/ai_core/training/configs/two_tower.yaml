# Giá trị THẬT SỰ đã chạy (trích từ checkpoint + cell notebook đã sinh kết quả),
# không phải giá trị dự kiến. Bản trước lệch: siamese 15000 step/batch 256 và
# highlight_fusion 20000 step/warmup 0.03 chưa bao giờ được chạy.
# user_dim/video_dim = số chiều feature, suy từ dữ liệu lúc chạy (MovieLens-100k:
# 942 user, 1702 video). scripts/train.py cũng ghi đè hai giá trị này từ file feature.
model:
  audio_dim: 64
  causal: false
  context_len: 1024
  d_model: 256
  dropout: 0.0
  img_size: 224
  in_chans: 3
  n_chars: 95
  n_classes: 10
  n_heads: 8
  n_layers: 6
  n_mels: 80
  name: two_tower
  patch_size: 16
  proj_dim: 128
  temperature: 0.1
  use_rope: false
  user_dim: 942
  video_dim: 1702
  vision_dim: 256
  vocab_size: 8192
  window_seconds: 120
train:
  batch_size: 256
  betas:
  - 0.9
  - 0.95
  ckpt_dir: checkpoints
  eval_every: 500
  grad_accum: 1
  grad_clip: 1.0
  log_dir: ''
  loss: two_tower_softmax
  lr: 0.001
  max_steps: 5000
  metric_name: ndcg_at_10
  min_lr_ratio: 0.1
  model: two_tower
  neg_alpha: 1.0
  precision: bf16
  seed: 1337
  warmup_ratio: 0.05
  weight_decay: 0.1
