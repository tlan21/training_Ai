# Giá trị THẬT SỰ đã chạy (trích từ checkpoint + cell notebook đã sinh kết quả),
# không phải giá trị dự kiến. Bản trước lệch: siamese 15000 step/batch 256 và
# highlight_fusion 20000 step/warmup 0.03 chưa bao giờ được chạy.
model:
  audio_dim: 64
  causal: false
  context_len: 1024
  d_model: 256
  dropout: 0.0
  img_size: 224
  in_chans: 3
  n_chars: 95
  n_classes: 10
  n_heads: 8
  n_layers: 6
  n_mels: 80
  name: siamese
  patch_size: 16
  proj_dim: 128
  temperature: 1.0
  use_rope: false
  user_dim: 128
  video_dim: 128
  vision_dim: 256
  vocab_size: 8192
  window_seconds: 120
train:
  batch_size: 128
  betas:
  - 0.9
  - 0.95
  ckpt_dir: checkpoints
  eval_every: 1000
  grad_accum: 1
  grad_clip: 1.0
  log_dir: ''
  loss: ''
  lr: 0.0003
  max_steps: 8000
  metric_name: recall_at_10
  min_lr_ratio: 0.1
  model: siamese
  neg_alpha: 0.0
  precision: bf16
  seed: 1337
  warmup_ratio: 0.03
  weight_decay: 0.1
