model:
  name: minigpt
  d_model: 384
  n_layers: 6
  n_heads: 6
  vocab_size: 8192
  context_len: 1024
train:
  model: minigpt
  lr: 6.0e-4
  weight_decay: 0.1
  batch_size: 8
  grad_accum: 8
  max_steps: 100000
  warmup_ratio: 0.03
  min_lr_ratio: 0.10
  precision: bf16
  seed: 1337
  metric_name: perplexity
