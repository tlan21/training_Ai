[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-core"
version = "0.1.0"
description = "Thuật toán AI nguyên thủy tự code: primitives, optim, tokenizer, 6 model (ViT, Siamese, ASR CTC, Highlight Fusion, Mini-GPT, Two-Tower)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tensorboard>=2.16",
]

[project.optional-dependencies]
# Cần cho T1.2 data pipeline (audio/video), không cần cho T1.1
data = ["soundfile>=0.12", "decord>=0.6"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["ai_core*"]

[tool.pytest.ini_options]
# Chỉ giữ thư mục tạm của lần chạy THẤT BẠI, thay vì 3 lần chạy gần nhất (mặc định). Test ở đây ghi
# PNG/WAV/manifest thật nên mỗi lần chạy tốn ~0,75 GB; giữ 3 lần làm ổ hệ thống đầy, và khi đầy thì
# test vỡ 18 chỗ với thông báo vô nghĩa (`bad allocation`, `FileNotFoundError`) — trông y như hồi
# quy code, mất cả lượt để lần ra là hết đĩa. Đã cắn thật.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
