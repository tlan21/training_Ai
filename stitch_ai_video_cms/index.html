<!DOCTYPE html>
<html lang="vi" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video CMS - Đăng nhập</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        try {
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            primary: "#461599",
                            "primary-container": "#5e35b1",
                            background: "#FAF9F6",
                            surface: "#fef7ff",
                            "on-surface": "#1d1a22",
                            "on-surface-variant": "#494453",
                            outline: "#7b7484",
                            "outline-variant": "#cbc3d5"
                        },
                        fontFamily: {
                            body: ["Inter"]
                        }
                    }
                }
            }
        } catch (_e) {}
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, rgba(94, 53, 177, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(70, 21, 153, 0.05) 0%, transparent 40%),
                        #FAF9F6;
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(70, 21, 153, 0.04);
        }
        .glow-input:focus {
            box-shadow: 0 0 0 3px rgba(94, 53, 177, 0.15);
            border-color: #5e35b1;
        }
    </style>
</head>
<body class="flex flex-col justify-center items-center p-4">
    <!-- Main Login Card -->
    <div class="w-full max-w-[460px] glass-card rounded-2xl p-8 transition-all duration-300">
        <!-- Logo Header -->
        <div class="flex flex-col items-center mb-8">
            <div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center mb-3 shadow-md shadow-primary/20">
                <span class="material-symbols-outlined text-white text-2xl" style="font-variation-settings: 'FILL' 1;">movie_filter</span>
            </div>
            <h1 class="text-2xl font-bold text-primary tracking-tight">AI Video CMS</h1>
            <p class="text-xs text-on-surface-variant/80 uppercase tracking-widest mt-1">Hệ thống biên tập & Quản lý video</p>
        </div>

        <!-- Notification Banner -->
        <div id="error-banner" class="hidden mb-6 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg flex items-start gap-2 animate-fadeIn">
            <span class="material-symbols-outlined text-red-500 text-lg shrink-0">error</span>
            <span id="error-message">Thông tin tài khoản hoặc mật khẩu không chính xác.</span>
        </div>

        <!-- Form -->
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label for="username" class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider mb-2">Tên đăng nhập hoặc Email</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-lg">person</span>
                    <input type="text" id="username" required 
                           class="w-full bg-white/50 border border-outline-variant rounded-lg pl-10 pr-4 py-2.5 text-sm outline-none transition-all duration-200 glow-input" 
                           placeholder="admin@stitch.ai hoặc admin">
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="password" class="block text-xs font-bold text-on-surface-variant uppercase tracking-wider">Mật khẩu</label>
                    <a href="#" class="text-xs text-primary hover:underline">Quên mật khẩu?</a>
                </div>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-lg">lock</span>
                    <input type="password" id="password" required 
                           class="w-full bg-white/50 border border-outline-variant rounded-lg pl-10 pr-10 py-2.5 text-sm outline-none transition-all duration-200 glow-input" 
                           placeholder="••••••••">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary">
                        <span id="password-toggle-icon" class="material-symbols-outlined text-lg">visibility</span>
                    </button>
                </div>
            </div>

            <div class="flex items-center">
                <input type="checkbox" id="remember" class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/20">
                <label for="remember" class="ml-2 text-sm text-on-surface-variant">Duy trì đăng nhập trên thiết bị này</label>
            </div>

            <button type="submit" id="submit-btn" 
                    class="w-full bg-primary hover:bg-primary-container text-white py-3 rounded-lg font-semibold transition-all duration-200 active:scale-98 shadow-md shadow-primary/10 flex items-center justify-center gap-2">
                <span id="btn-text">Đăng nhập</span>
                <div id="btn-spinner" class="hidden w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
            </button>
        </form>

        <div class="my-6 flex items-center justify-between text-outline-variant">
            <span class="w-[30%] border-t border-current"></span>
            <span class="text-xs uppercase tracking-wider text-outline">Đăng nhập nhanh</span>
            <span class="w-[30%] border-t border-current"></span>
        </div>

        <!-- Quick Logins -->
        <div class="grid grid-cols-2 gap-3">
            <button onclick="quickLogin('admin')" 
                    class="flex items-center justify-center gap-2 py-2 px-3 bg-primary/5 hover:bg-primary/10 border border-primary/10 rounded-lg text-primary hover:text-primary-container font-medium text-xs transition-all duration-150 active:scale-95">
                <span class="material-symbols-outlined text-sm">shield_person</span>
                <span>Quản trị viên</span>
            </button>
            <button onclick="quickLogin('editor')" 
                    class="flex items-center justify-center gap-2 py-2 px-3 bg-secondary-container/20 hover:bg-secondary-container/40 border border-secondary-container/20 rounded-lg text-on-secondary-container font-medium text-xs transition-all duration-150 active:scale-95">
                <span class="material-symbols-outlined text-sm">edit_document</span>
                <span>Biên tập viên</span>
            </button>
        </div>
    </div>

    <!-- Footer -->
    <div class="mt-8 text-xs text-on-surface-variant/60">
        &copy; 2026 AI Video CMS. Tất cả quyền được bảo lưu.
    </div>

    <!-- Scripts -->
    <script>
        // Check if already logged in
        if (localStorage.getItem('currentUser')) {
            window.location.href = 't_ng_quan_h_th_ng/code.html';
        }

        const mockUsers = {
            admin: {
                username: "admin@stitch.ai",
                altUsername: "admin",
                password: "admin",
                name: "Admin CMS",
                role: "Quản trị viên",
                avatar: "https://lh3.googleusercontent.com/aida-public/AB6AXuDrzPBszfO5okSDaqZiK3Bho9HLBk1L0AElU6NeDO0OfsFbakDrOcoDBzqCpuGZBnveC9c8bcYpXlMCt0BJhMv6u710loa_-u8uLsVVOC_KkQ67R3xZilFc264c3maWxJTpFSTCOyJ1T83Tr3KJ9OjYfDRhYBn0H5wgAvDbcRigUtVHudhmT4t7Gr89jtbnQQRZ1Je6feN_CdulRz4LgatZmSZsRI_6dqT1042Z0AoFhAE-WT8WZ306Ls_pHHEzAf7dqB3go42MXR4"
            },
            editor: {
                username: "editor@stitch.ai",
                altUsername: "editor",
                password: "editor",
                name: "Editor CMS",
                role: "Biên tập viên",
                avatar: "https://lh3.googleusercontent.com/aida-public/AB6AXuDiKW0TVbE0SjU7uqyP2G1wNGvI7BFndDOqhq2_NQzneNpXAJGSjgYu0wLesQ6xTcmwGyWR_Ps5DHJNJGTgxJlnBc0MC6FAE-5GqDKGfih_hNWY1M2dv41Zm6YlO-S90BQ4igiko5a_J4hdD6z0vhKJIeJZDgVB-iglf0BerdA0wez7XA4n2BxmlvP_wbZoUUBvIuRES7Gh0z4eUFkFfUWjHvOL9gfUIIX1MLMN2PPw1VrLL5Gm3qc7oCdhx1usaws2L_51g1upTnE"
            }
        };

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const toggleIcon = document.getElementById('password-toggle-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleIcon.textContent = 'visibility_off';
            } else {
                pwdInput.type = 'password';
                toggleIcon.textContent = 'visibility';
            }
        }

        function quickLogin(type) {
            const user = mockUsers[type];
            document.getElementById('username').value = user.username;
            document.getElementById('password').value = user.password;
            
            // Auto submit
            document.getElementById('submit-btn').click();
        }

        function handleLogin(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const errorBanner = document.getElementById('error-banner');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');

            errorBanner.classList.add('hidden');

            // Find matching mock user
            let authenticatedUser = null;
            for (const key in mockUsers) {
                const user = mockUsers[key];
                if ((usernameInput === user.username || usernameInput === user.altUsername) && passwordInput === user.password) {
                    authenticatedUser = user;
                    break;
                }
            }

            if (authenticatedUser) {
                // Show loading
                submitBtn.disabled = true;
                btnText.textContent = "Đang xử lý...";
                btnSpinner.classList.remove('hidden');

                setTimeout(() => {
                    localStorage.setItem('currentUser', JSON.stringify({
                        name: authenticatedUser.name,
                        role: authenticatedUser.role,
                        username: authenticatedUser.username,
                        avatar: authenticatedUser.avatar
                    }));
                    window.location.href = 't_ng_quan_h_th_ng/code.html';
                }, 800);
            } else {
                errorBanner.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
