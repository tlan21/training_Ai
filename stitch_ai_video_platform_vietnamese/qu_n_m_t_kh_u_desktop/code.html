<!-- Recovery Form -->
<form class="space-y-6" id="recoveryForm">
<!-- Input Field -->
<div class="flex flex-col space-y-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="recovery-identity">Email hoặc Số điện thoại</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="mail">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low border border-outline-variant rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all font-body-md text-on-surface" id="recovery-identity" name="identity" placeholder="username@email.com" required="" type="text"/>
</div>
</div>
<!-- Action Button -->
<button class="group relative w-full flex items-center justify-center py-3.5 px-4 bg-primary text-on-primary font-title-lg text-title-lg rounded-lg hover:bg-primary-container active:scale-95 transition-all duration-200 shadow-md" type="submit">
<span class="mr-2">Gửi yêu cầu</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</button>

<!-- Micro-interaction Script -->
<script>
        document.getElementById('recoveryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            
            // Visual feedback for interaction
            btn.disabled = true;
            btn.innerHTML = `
                <span class="animate-spin mr-2">
                    <span class="material-symbols-outlined" data-icon="progress_activity">progress_activity</span>
                </span>
                Đang xử lý...
            `;
            
            // Simulate API call
            setTimeout(() => {
                const card = document.querySelector('.glass-card');
                card.style.opacity = '0';
                card.style.transform = 'translateY(10px)';
                
                setTimeout(() => {
                    card.innerHTML = `
                        <div class="flex flex-col items-center text-center py-4">
                            <div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center text-on-primary-container mb-6 animate-bounce">
                                <span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                            </div>
                            <h2 class="font-headline-md text-headline-md text-on-surface mb-3">Đã gửi yêu cầu!</h2>
                            <p class="font-body-md text-body-md text-on-surface-variant mb-8 px-2">
                                Chúng tôi đã gửi email hướng dẫn đến địa chỉ của bạn. Vui lòng kiểm tra hộp thư đến (hoặc thư rác).
                            </p>
                            <button onclick="window.location.href='../login_desktop/code.html'" class="w-full py-3 bg-primary text-on-primary font-title-lg text-title-lg rounded-lg hover:bg-primary-container transition-all">
                                Hoàn tất
                            </button>
                        </div>
                    `;
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 300);
            }, 1500);
        });
    </script>
