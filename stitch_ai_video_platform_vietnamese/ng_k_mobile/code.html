<script>
        // Micro-interactions for input fields
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').style.opacity = '1';
                input.parentElement.querySelector('.material-symbols-outlined').style.color = '#630ed4';
            });
            input.addEventListener('blur', () => {
                if (!input.value) {
                    input.parentElement.querySelector('.material-symbols-outlined').style.opacity = '0.6';
                    input.parentElement.querySelector('.material-symbols-outlined').style.color = 'inherit';
                }
            });
