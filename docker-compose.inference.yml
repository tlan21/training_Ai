# Explicit Docker AI deployment requested by user; source/weights remain Claude-owned.
# Consume Claude's prebuilt, parity-verified release #7 image (HC-19); do not rebuild it.
# Official AI runtime: this container, internal port only (HC-16).
services:
  inference-service:
    image: video-ai-inference:ai-v3.0-48735ff
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:?Set the existing Claude AI_SERVICE_KEY in the process environment}
      FORCE_STUB: "0"
      INFER_DEVICE: cpu
      CHECKPOINT_DIR: /srv/ai-core/checkpoints
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: bind
        source: ${AI_CHECKPOINT_BIND:-E:/traning_ai/ai-core/checkpoints}
        target: /srv/ai-core/checkpoints
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; h=json.load(urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=5)); assert h['stub_mode'] is False and len(h['models_loaded']) == 6 and not h['degraded'], h"]
      interval: 10s
      timeout: 8s
      start_period: 60s
      retries: 12
  gateway:
    environment:
      AI_BASE_URL: http://inference-service:8001
      AI_ALLOW_STUB: "0"
    depends_on:
      inference-service: { condition: service_healthy }
