<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Video CMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
    <style>/* fallback icon khi Material Symbols chưa tải: ẩn text, tránh overlap */
      .material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
      .material-symbols-outlined:empty:before{content:""}
    </style>
    <script>
      // icon SVG fallback — nếu font không tải (offline/CSP), thay bằng SVG inline để không hiện chữ
      (function(){
        var map={person:'<path d="M12 12c2.21 0 4-1.79 4-4S14.21 4 12 4 8 5.79 8 8s1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>',lock:'<path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/>',visibility:'<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>',visibility_off:'<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16c.42-.14.86-.22 1.33-.22zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 2 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>',arrow_forward:'<path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>',error:'<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>',movie_filter:'<path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-2zM6 16H5v-2h1v2zm0-4H5v-2h1v2zm0-4H5V6h1v2zm11 8h-7v-2h7v2zm0-4h-7v-2h7v2zm0-4h-7V6h7v2z"/>',shield_person:'<path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 4c1.86 0 3.41 1.28 3.86 3H8.14c.45-1.72 2-3 3.86-3zm-4 6c0-1.1.9-2 2-2s2 .9 2 2-.9 2-2 2-2-.9-2-2zm4 6H8c0-1.66 1.34-3 3-3s3 1.34 3 3z"/>',edit_document:'<path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>',progress_activity:'<path d="M12 4V2l8 8-8 8v-2c-3.31 0-6 2.69-6 6 0 .69.09 1.36.25 2L4.25 22C3.46 20.42 3 18.74 3 16c0-4.97 4.03-9 9-9z"/>'};
        function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
        function svgFor(name, size, color){
          var p=map[name]; if(!p) return null;
          return '<svg viewBox="0 0 24 24" width="'+size+'" height="'+size+'" fill="'+(color||'currentColor')+'" aria-hidden="true" style="display:inline-block;vertical-align:middle">'+p+'</svg>';
        }
        function replaceOne(el){
          var name=(el.textContent||'').trim(); var s=svgFor(name, el.style.fontSize||'18px', el.style.color||'');
          if(!s) return false; el.setAttribute('data-icon', name); el.innerHTML=s; el.style.fontFamily='inherit'; el.style.letterSpacing='normal'; return true;
        }
        // chạy sau font load, nếu font chưa sẵn sau 1.5s thì fallback SVG
        function fallbackIfNeeded(){
          var test=document.createElement('span'); test.className='material-symbols-outlined'; test.textContent='person'; test.style.position='absolute'; test.style.visibility='hidden'; document.body.appendChild(test);
          var w1=test.offsetWidth; setTimeout(function(){
            var w2=test.offsetWidth; // nếu width không đổi hoặc font không khác system, coi như chưa load
            var need = (document.fonts && document.fonts.check) ? !document.fonts.check('12px "Material Symbols Outlined"') : (w1===w2);
            if(need){ document.querySelectorAll('.material-symbols-outlined').forEach(replaceOne); }
            document.body.removeChild(test);
          },1500);
        }
        if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', fallbackIfNeeded); else fallbackIfNeeded();
        // expose để toggle visibility có thể gọi lại
        window.__iconFallback = replaceOne;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
