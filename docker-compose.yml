name: video-ai

# Full src: postgres/mongo/redis/minio/etcd/milvus/kafka + gateway/orchestrator/ffmpeg-cutter + cms (nginx proxies /api → gateway:8000)
# Chạy:  docker compose --env-file .env -f docker-compose.yml up -d --build
# Check: curl http://localhost:8000/healthz ; open http://localhost:5173
# Log:   docker compose logs -f gateway orchestrator ffmpeg-cutter cms
# Dừng:  docker compose down

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_pw}
      POSTGRES_DB: ${POSTGRES_DB:-video_ai}
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-video_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-app}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-app_pw}
      MONGO_APP_DB: ${MONGO_DB:-video_ai}
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  # MinIO/Kafka/Milvus are required for real upload and visual search.
  minio:
    build: { context: ., dockerfile: infra/minio/Dockerfile }
    image: video-ai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-06-12T14-34-03Z
    profiles: ["full"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/videos;
      mc mb -p local/milvus;
      echo '[minio-init] buckets: videos, milvus';
      exit 0;
      "
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: ["etcd", "--advertise-client-urls=http://etcd:2379", "--listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd"]
    volumes: [etcd_data:/etcd]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
  milvus:
    image: milvusdb/milvus:v2.4.9
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET_NAME: milvus
      # Build HNSW even for the small local demo corpus, rather than silently brute-forcing <1024 rows.
      INDEXCOORD_SEGMENT_MINSEGMENTNUMROWSTOENABLEINDEX: "1"
    ports: ["127.0.0.1:19530:19530", "127.0.0.1:9091:9091"]
    volumes: [milvus_data:/var/lib/milvus]
    depends_on:
      etcd: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports: ["9092:9092"]
    volumes: [kafka_data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
  inference-service:
    build: { context: ., dockerfile: inference-service/Dockerfile }
    image: video-ai-inference
    ports: ["127.0.0.1:8001:8001"]
    environment:
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-sk-local-dev-key-change-me}
      CHECKPOINT_DIR: /srv/ai-core/checkpoints
      INFER_DEVICE: ${INFER_DEVICE:-cpu}
      FORCE_STUB: "0"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      MILVUS_HOST: milvus
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-12345678}
    volumes:
      - ./ai-core/checkpoints:/srv/ai-core/checkpoints:ro
      - ingest_work:/srv/work:ro
    depends_on:
      milvus: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; h=json.load(urllib.request.urlopen('http://localhost:8001/health')); assert not h['stub_mode'] and len(h['models_loaded'])==6"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  kafka-init:
    image: apache/kafka:3.8.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "for topic in video.uploaded video.preprocessed ai.stage.completed clip.cut.requested clip.cut.completed; do /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --replication-factor 1 --partitions 1 --topic $$topic || exit 1; done"
    depends_on:
      kafka: { condition: service_healthy }
  ingest-worker:
    image: video-ai-inference
    command: ["python", "/srv/ingest-worker/main.py"]
    environment:
      KAFKA_BROKERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-12345678}
    volumes:
      - ingest_work:/srv/work
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
  gateway:
    build: { context: ., dockerfile: backend/Dockerfile }
    image: video-ai-gateway
    command: ["gateway"]
    ports: ["8000:8000"]
    environment:
      GATEWAY_PORT: "8000"
      POSTGRES_DSN: postgres://app:123456@postgres:5432/video_ai?sslmode=disable
      MONGO_URI: mongodb://app:123456@mongo:27017
      MONGO_DB: video_ai
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      KAFKA_BROKERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-12345678}
      MINIO_BUCKET: videos
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: "123456"
      JWT_SECRET: change-me-32-random-chars__openssl-rand-hex-32
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-sk-local-dev-key-change-me}
      AI_BASE_URL: http://inference-service:8001
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
      inference-service: { condition: service_healthy }
    volumes:
      - ingest_work:/srv/work
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
  orchestrator:
    profiles: ["full"]
    build: { context: ., dockerfile: backend/Dockerfile }
    image: video-ai-gateway
    command: ["orchestrator"]
    environment:
      POSTGRES_DSN: postgres://app:123456@postgres:5432/video_ai?sslmode=disable
      MONGO_URI: mongodb://app:123456@mongo:27017
      KAFKA_BROKERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: "12345678"
      JWT_SECRET: change-me-32-random-chars__openssl-rand-hex-32
      AI_BASE_URL: http://inference-service:8001
      AI_SERVICE_KEY: sk-local-dev-key-change-me
    depends_on:
      gateway: { condition: service_healthy }
  ffmpeg-cutter:
    profiles: ["full"]
    build: { context: ., dockerfile: backend/Dockerfile }
    image: video-ai-gateway
    command: ["ffmpeg-cutter"]
    environment:
      KAFKA_BROKERS: kafka:9092
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: "12345678"
    depends_on:
      gateway: { condition: service_healthy }
  cms:
    build: { context: ., dockerfile: cms/Dockerfile, args: { VITE_API_BASE: "" } }
    image: video-ai-cms
    ports: ["5173:80"]
    depends_on:
      gateway: { condition: service_healthy }
  client:
    build: { context: ., dockerfile: client/Dockerfile }
    image: video-ai-client
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      gateway: { condition: service_healthy }

volumes:
  pg_data:
  mongo_data:
  redis_data:
  minio_data:
  etcd_data:
  milvus_data:
  kafka_data:
  ingest_work:
